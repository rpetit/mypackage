[project]
name = "mypackage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Romain Petit", email = "petitromain@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
]

[project.scripts]
mypackage = "mypackage:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
