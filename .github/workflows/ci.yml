name: CI

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
      	os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14", "3.15"]
        
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest